<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Játszmák · Kovács család: Fekete Macska</title>
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<div class="page">
  <p class="back"><a href="../">← Áttekintés</a></p>
  <header>
    <p class="eyebrow">Kovács család · Fekete Macska</p>
    <h1>Játszmák</h1>
  </header>

  <div id="status" class="status"></div>

  <section>
    <div class="table-wrap">
      <table class="games-table">
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <p class="legend">Végső pontszámok · félkövér: győztes</p>
  </section>

  <section>
    <div class="section-head">
      <h2>Összesítés</h2>
      <div class="segmented" role="tablist" id="summary-switch">
        <button role="tab" aria-selected="true" data-mode="seating">Sorrend</button>
        <button role="tab" aria-selected="false" data-mode="starter">Kezdőjátékos</button>
      </div>
    </div>
    <div class="table-wrap">
      <table class="summary-table">
        <thead id="summary-head"></thead>
        <tbody id="summary-body"></tbody>
      </table>
    </div>
  </section>
</div>

<script type="module" src="../assets/list.js"></script>
</body>
</html>

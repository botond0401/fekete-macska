<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Kovács család: Fekete Macska</title>
<link rel="stylesheet" href="assets/style.css?v=20261110121046">
</head>
<body>
<div class="page">
  <header class="hero">
    <div class="hero-text">
      <p class="hero-eyebrow">Kovács család</p>
      <h1>Fekete Macska</h1>
    </div>
  </header>

  <div id="status" class="status"></div>

  <section>
    <div class="tiles">
      <div class="tile">
        <div class="tile-label">Rögzített játszmák</div>
        <div class="tile-value" id="game-count">–</div>
        <div class="tile-sub" id="avg-rounds"></div>
      </div>
      <div class="tile">
        <div class="tile-label">Utolsó játszma</div>
        <div class="tile-value small" id="last-date">–</div>
        <div class="tile-sub" id="last-ago"></div>
      </div>
      <div class="tile">
        <div class="tile-label">Legsimább győzelem</div>
        <div class="tile-value" id="best-score">–</div>
        <div class="tile-sub" id="best-who"></div>
      </div>
    </div>
  </section>

  <section>
    <h2>Rangsor</h2>
    <ol class="ranking" id="ranking"></ol>
    <button class="toggle" id="details-toggle" aria-expanded="false" aria-controls="details">
      Részletes statisztika <span class="chevron"></span>
    </button>
    <div class="table-wrap" id="details" hidden>
      <table class="stats-table">
        <thead id="details-head"></thead>
        <tbody id="details-body"></tbody>
      </table>
    </div>
  </section>

  <section>
    <a class="nav-link" href="jatszmak/">Összes játszma <span class="chevron"></span></a>
  </section>
</div>

<script type="module" src="assets/main.js?v=20261110121046"></script>
</body>
</html>

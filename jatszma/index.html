<!DOCTYPE html>
<html lang="hu">
<head>

    <p class="eyebrow" id="subtitle">Játszma</p>

    <p class="legend">
      <span><span class="mark zero">0</span> nullázás</span>
      <span><span class="mark bumszli">18</span> bumszli</span>
